services:

  db:
    image: postgres:15
    container_name: odoo_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - odoo_network

  odoo:
    image: odoo:17
    container_name: odoo_app
    restart: always
    depends_on:
      - db
    ports:
      - "8069:8069"        # main web interface
      - "8072:8072"        # live chat / websocket
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    networks:
      - odoo_network

volumes:
  odoo_db_data:
  odoo_web_data:

networks:
  odoo_network:
    driver: bridge